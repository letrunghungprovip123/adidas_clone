name: V2 Foundation Quality Gate
on:
  push:
    branches: [refactor/v2-phase1-foundation]
    paths:
      - 'AdidasCloneBackEnd/apps/**'
      - 'AdidasCloneBackEnd/libs/**'
      - 'AdidasCloneBackEnd/tests/**'
      - 'AdidasCloneBackEnd/scripts/phase2/**'
      - 'AdidasCloneBackEnd/scripts/phase3/**'
      - 'AdidasCloneBackEnd/infra/**'
      - 'AdidasCloneBackEnd/package.json'
      - 'AdidasCloneBackEnd/package-lock.json'
      - 'AdidasCloneBackEnd/tsconfig*.json'
      - 'AdidasCloneBackEnd/eslint.config.mjs'
      - 'AdidasCloneBackEnd/nest-cli.json'
      - '.github/workflows/v2-foundation.yml'
  pull_request:
    paths:
      - 'AdidasCloneBackEnd/**'
      - '.github/workflows/v2-foundation.yml'
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s --health-timeout 10s --health-retries 40
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: ci_inventory
          RABBITMQ_DEFAULT_PASS: ci-inventory-rabbit-password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v2_local
          POSTGRES_PASSWORD: ci-inventory-only-password
          POSTGRES_DB: inventory_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U v2_local -d inventory_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      V2_INVENTORY_DB_HOST: 127.0.0.1
      V2_INVENTORY_DB_PORT: '5432'
      V2_INVENTORY_DB_USER: v2_local
      V2_INVENTORY_DB_PASSWORD: ci-inventory-only-password
      V2_INVENTORY_DB_NAME: inventory_db
      V2_INVENTORY_RMQ_USER: ci_inventory
      V2_INVENTORY_RMQ_PASSWORD: ci-inventory-rabbit-password
      V2_CATALOG_DB_HOST: 127.0.0.1
      V2_CATALOG_DB_PORT: '5432'
      V2_CATALOG_DB_USER: v2_local
      V2_CATALOG_DB_PASSWORD: ci-inventory-only-password
      V2_CATALOG_DB_NAME: catalog_db
      V2_CATALOG_RMQ_USER: ci_inventory
      V2_CATALOG_RMQ_PASSWORD: ci-inventory-rabbit-password
      V2_CATALOG_ES_URL: http://127.0.0.1:9200
    defaults:
      run:
        working-directory: AdidasCloneBackEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm Node major
        run: node -e "if(process.versions.node.split('.')[0]!=='24')process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Lint and typecheck
        run: npm run lint && npm run typecheck
      - name: Unit/static architecture checks
        run: npm test
      - name: Compile all V2 apps
        run: npm run build
      - name: Apply isolated V2 Inventory migration
        run: npm run migrate:inventory
      - name: Inventory domain integration checks against real PostgreSQL
        run: npm run test:inventory
      - name: Verify real RabbitMQ request-response and event outbox
        run: npm run test:inventory:rmq
      - name: Prepare isolated Catalog database in CI PostgreSQL
        run: node -e "const{Pool}=require('pg');const p=new Pool({host:'127.0.0.1',user:'v2_local',password:process.env.V2_CATALOG_DB_PASSWORD,database:'postgres'});p.query('CREATE DATABASE catalog_db').then(()=>p.end()).catch(e=>{console.error(e);process.exit(1)})"
      - name: Apply V2 Catalog migration
        run: npm run migrate:catalog
      - name: Verify and import original Catalog seed
        run: npm run seed:catalog:check && npm run seed:catalog
      - name: Catalog PostgreSQL domain integration
        run: npm run test:catalog
      - name: Check original seed variant parser without writing to any database
        run: npm run seed:inventory:check
      - name: Production dependency high severity guard
        run: npm audit --omit=dev --audit-level=high
      - name: Exercise live V2 gateway and all service skeletons
        run: npm run smoke:foundation
      - name: Compose schema validation (no containers started)
        env:
          V2_POSTGRES_PASSWORD: ci-placeholder-not-a-real-secret
          V2_RABBITMQ_USER: ci
          V2_RABBITMQ_PASSWORD: ci-placeholder-not-a-real-secret
          V2_ALLOWED_ORIGINS: http://localhost:3001
        run: docker compose -f infra/docker/docker-compose.v2.yml config --quiet
