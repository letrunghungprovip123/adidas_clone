name: V2 Inventory One-time Lock Refresh
# Second and final lock refresh includes Nest RabbitMQ transport connection manager
on:
  push:
    branches: [refactor/v2-phase1-foundation]
    paths:
      - '.github/workflows/v2-phase2-lock-bootstrap.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdidasCloneBackEnd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-phase1-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recompute lockfile from reviewed pinned packages
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit only package-lock.json to the existing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(inventory): lock patched Nest 11 and PG/Rabbit dependencies"
            git pull --rebase origin refactor/v2-phase1-foundation
            git push origin HEAD:refs/heads/refactor/v2-phase1-foundation
          fi
