services:
  postgres-v2:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh:ro
    networks: [adidas_v2]

  rabbitmq-v2:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - "15673:15672"
    networks: [adidas_v2]

  elasticsearch-v2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_v2_data:/usr/share/elasticsearch/data
    networks: [adidas_v2]

  api-gateway-v2:
    build:
      context: .
      dockerfile: Dockerfile
      args: { APP: api-gateway }
    environment:
      PORT: 3100
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      FRONTEND_ORIGIN: http://localhost:3001,http://localhost:3002
    ports:
      - "3100:3100"
    depends_on:
      - rabbitmq-v2
      - identity-service
      - customer-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
      - promotion-service
      - notification-service
    networks: [adidas_v2]

  identity-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: identity-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/identity_db
      JWT_SECRET: replace-with-a-long-random-secret
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  customer-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: customer-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      CUSTOMER_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/customer_db
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  catalog-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: catalog-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      CATALOG_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/catalog_db
      ELASTICSEARCH_URL: http://elasticsearch-v2:9200
    depends_on: [postgres-v2, rabbitmq-v2, elasticsearch-v2]
    networks: [adidas_v2]

  inventory-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: inventory-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      INVENTORY_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/inventory_db
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  order-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: order-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      ORDER_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/order_db
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  payment-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: payment-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      PAYMENT_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/payment_db
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_replace_me
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  promotion-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: promotion-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      PROMOTION_DATABASE_URL: postgresql://postgres:postgres_dev@postgres-v2:5432/promotion_db
    depends_on: [postgres-v2, rabbitmq-v2]
    networks: [adidas_v2]

  notification-service:
    build: { context: ., dockerfile: Dockerfile, args: { APP: notification-service } }
    environment:
      RABBITMQ_URL: amqp://admin:change-me@rabbitmq-v2:5672
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
    depends_on: [rabbitmq-v2]
    networks: [adidas_v2]

networks:
  adidas_v2:
    driver: bridge

volumes:
  postgres_v2_data:
  es_v2_data:
